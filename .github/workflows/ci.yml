name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    name: stylua (format check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned, not "latest", like every repo of the fleet.
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua TESTS scripts plugin

  tests:
    name: specs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # One shell on all three platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # lib.nvim is a hard runtime dependency; the runner finds it in .deps/lib.nvim (and names all
      # four places it searched when it is missing: exit code 3).
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          # Pinned (it is part of every cache key); move it on purpose.
          version: v0.12.2
      # The result cache, as docs/CI-CACHE.md describes it: the key of the cache action is only the transport
      # (each entry carries its full spec key), pull requests restore and never save, the main branch saves.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/testing-cache
          key: testing-${{ runner.os }}-nvim0.12.2-${{ github.sha }}
          restore-keys: testing-${{ runner.os }}-nvim0.12.2-
      # Dogfood: this repository's own specs run through its own runner (scripts/test.sh wraps
      # `nvim -l scripts/testing.lua .`), with the Result-IR and a JUnit report as artifacts.
      - name: Run the specs with testing.nvim
        env:
          TESTING_CACHE_HOME: ${{ runner.temp }}/testing-cache
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          scripts/test.sh --cached --github --json "$RUNNER_TEMP/self-ir.json" --junit "$RUNNER_TEMP/self-junit.xml"
      - uses: actions/cache/save@v4
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/testing-cache
          key: testing-${{ runner.os }}-nvim0.12.2-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: self-run-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/self-ir.json
            ${{ runner.temp }}/self-junit.xml
            ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  # M0 exit criterion kept as a regression check: lib.nvim's whole suite, unchanged, runs through
  # testing.nvim's driver with the same verdict as lib.nvim's own TESTS/run.lua. Not part of the
  # ci-verified gate yet: it has only been verified locally (Windows), and lib.nvim's suite
  # touches git and the network, so it must prove stable on all three runners first.
  lib-suite:
    name: lib.nvim suite via testing.nvim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      # telemetry_wrap_spec.lua needs the real runtime-analysis.telemetry module on the runtimepath.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/runtime-analysis.nvim
          path: .deps/runtime-analysis.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # lib.nvim's git_spec.lua reads the checkout it runs in and expects the branch to be `main`
      # (lib's own CI checks out main). The ci-verified checkout is on a branch of that other name,
      # so give it the name the unchanged lib.nvim spec expects; the commit stays the same.
      - name: Name the lib.nvim checkout's branch main
        run: git -C .deps/lib.nvim checkout -B main
      - name: Run the lib.nvim suite
        env:
          LIB_NVIM_DIR: ${{ github.workspace }}/.deps/lib.nvim
          DRIVER: ${{ github.workspace }}/scripts/testing.lua
          RTP_EXTRA: ${{ github.workspace }}/.deps/runtime-analysis.nvim
          IR_FILE: ${{ runner.temp }}/lib-suite-ir.json
        run: |
          exec > >(tee -a "$RUNNER_TEMP/lib-suite-output.log") 2>&1
          # The specs read the working directory as "this repository": run from the lib.nvim root.
          cd .deps/lib.nvim
          # --first-run: lib.nvim's own deps_spec tests the first-run float, the default would switch it off
          nvim -n -i NONE --headless -u NONE -l "$DRIVER" . --first-run --rtp "$RTP_EXTRA" --json "$IR_FILE"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lib-suite-ir-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/lib-suite-ir.json
            ${{ runner.temp }}/lib-suite-output.log
          if-no-files-found: ignore
          retention-days: 14

  # Consumers of this repo that check it out as a CI dependency pin `ref: ci-verified`: that branch
  # only ever moves once stylua, luacheck and the three-platform test matrix have all passed.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [stylua, luacheck, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Never move ci-verified backwards: two pushes can finish out of order, and the older run
      # must not overwrite the newer verified commit. The lookup fails closed and the update
      # carries a lease on the tip it compared against.
      - name: Publish ci-verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(git ls-remote --heads origin refs/heads/ci-verified | cut -f1)
          if [ -z "$tip" ]; then
            git push origin HEAD:refs/heads/ci-verified
            exit 0
          fi
          status=$(gh api "repos/$REPO/compare/$tip...$SHA" --jq .status)
          case "$status" in
            behind | identical)
              echo "ci-verified ($tip) is '$status' relative to $SHA; leaving it alone"
              ;;
            ahead | diverged)
              git push origin HEAD:refs/heads/ci-verified --force-with-lease="refs/heads/ci-verified:$tip"
              ;;
            *)
              echo "::error::unexpected compare status '$status' for $tip...$SHA"
              exit 1
              ;;
          esac
